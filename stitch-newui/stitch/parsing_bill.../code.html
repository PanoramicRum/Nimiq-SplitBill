<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Parsing Receipt - SplitBill</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#048acd",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1c23",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .nimiq-gradient {
            background: linear-gradient(135deg, #048acd 0%, #024b70 100%);
        }
        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between p-6">
<button class="flex items-center justify-center size-10 rounded-full bg-slate-200/50 dark:bg-primary/10 text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl">receipt_long</span>
<span class="font-bold text-lg tracking-tight">SplitBill</span>
</div>
<div class="size-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 flex flex-col items-center justify-center px-6 max-w-md mx-auto w-full">
<!-- Receipt Scanning Visualization -->
<div class="relative w-full aspect-[3/4] mb-12 group">
<!-- Background Card / Receipt Shadow -->
<div class="absolute inset-0 bg-primary/20 rounded-xl blur-2xl transform scale-95 translate-y-4"></div>
<!-- The Receipt Canvas -->
<div class="relative h-full w-full bg-slate-50 dark:bg-slate-800 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 shadow-2xl">
<!-- Image Placeholder -->
<div class="absolute inset-0 bg-cover bg-center opacity-40 grayscale" data-alt="Close up shot of a paper store receipt" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCUvocPNHCb2hYhGuaofTVogV-50qQeP68d5stJK8KuF_LyIl60_-j7tpk8OAk0GlyJH8-Yj4zDmUMTE-OmitoUzpN4bTv2hi9eZUCL3ngdpim3pQz9czBapLoE1klS5kPaM4Us0dhpwIrHf9whFng4t0WsWc_keplur1PuIxkcxwkBgPQs9AhpbFvPg0QvwvY36MAHUoBd_Brsv-QFDUj89ORaKWuSjGBd8mV9U5WdGy0F2FLlL8qSBwBJi5WOcXpN_Q62AGC50Dw')">
</div>
<!-- Scanning Line (Nimiq Style) -->
<div class="absolute top-1/2 left-0 w-full h-1 nimiq-gradient shadow-[0_0_15px_rgba(4,138,205,0.8)] z-20"></div>
<!-- Skeleton Loading Content -->
<div class="absolute inset-0 p-8 flex flex-col gap-4">
<div class="h-6 w-3/4 bg-slate-300 dark:bg-slate-700 rounded shimmer"></div>
<div class="h-4 w-1/2 bg-slate-300 dark:bg-slate-700 rounded shimmer"></div>
<div class="mt-8 space-y-3">
<div class="flex justify-between">
<div class="h-4 w-1/3 bg-slate-300 dark:bg-slate-700 rounded-full shimmer"></div>
<div class="h-4 w-12 bg-slate-300 dark:bg-slate-700 rounded-full shimmer"></div>
</div>
<div class="flex justify-between">
<div class="h-4 w-1/2 bg-slate-300 dark:bg-slate-700 rounded-full shimmer"></div>
<div class="h-4 w-12 bg-slate-300 dark:bg-slate-700 rounded-full shimmer"></div>
</div>
<div class="flex justify-between">
<div class="h-4 w-2/5 bg-slate-300 dark:bg-slate-700 rounded-full shimmer"></div>
<div class="h-4 w-12 bg-slate-300 dark:bg-slate-700 rounded-full shimmer"></div>
</div>
</div>
</div>
</div>
<!-- OCR Floating Indicators -->
<div class="absolute -right-4 top-1/4 bg-white dark:bg-slate-900 p-3 rounded-lg shadow-xl border border-primary/20 z-30">
<span class="material-symbols-outlined text-primary block text-2xl">font_download</span>
</div>
<div class="absolute -left-2 bottom-1/3 bg-white dark:bg-slate-900 p-3 rounded-lg shadow-xl border border-primary/20 z-30">
<span class="material-symbols-outlined text-primary block text-2xl">payments</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-4">
<h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">
                Parsing your receipt...
            </h1>
<p class="text-slate-500 dark:text-slate-400 text-lg leading-relaxed">
                Our AI is extracting items, tax, and total <br/>to save you the manual work.
            </p>
</div>
<!-- Progress Section -->
<div class="w-full mt-10 space-y-3">
<div class="flex items-end justify-between px-1">
<div class="flex flex-col">
<span class="text-primary font-semibold text-sm uppercase tracking-wider">Status</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">Processing lines...</span>
</div>
<span class="text-2xl font-bold text-primary">65%</span>
</div>
<div class="h-3 w-full bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full w-[65%] nimiq-gradient rounded-full"></div>
</div>
<div class="flex items-center justify-center gap-2 pt-4">
<span class="flex size-2 rounded-full bg-primary/40"></span>
<span class="flex size-2 rounded-full bg-primary/40"></span>
<span class="flex size-2 rounded-full bg-primary animate-pulse"></span>
</div>
</div>
</main>
<!-- Bottom Footer (Optional) -->
<footer class="p-8 text-center">
<p class="text-slate-400 dark:text-slate-500 text-xs font-medium uppercase tracking-[0.2em]">
            Powered by OCR.AI Engine
        </p>
</footer>
</body></html>
