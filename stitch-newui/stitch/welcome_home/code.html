<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#048acd",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1c23",
                        "accent-gold": "#ecb018",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .nimiq-gradient {
            background: radial-gradient(circle at 50% -20%, #05a5f5 0%, #048acd 35%, #0f1c23 85%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display transition-colors duration-300">
<div class="relative flex h-screen w-full flex-col overflow-hidden nimiq-gradient">
<!-- Header -->
<header class="flex items-center justify-between p-6">
<div class="flex items-center gap-2">
<div class="bg-primary p-2 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-white text-2xl">account_balance_wallet</span>
</div>
<h1 class="text-xl font-extrabold tracking-tight text-white uppercase italic">Split<span class="text-primary">Bill</span></h1>
</div>
<button class="flex items-center justify-center w-12 h-12 rounded-full glass-card text-white hover:bg-white/10 transition-all">
<span class="material-symbols-outlined">person</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center px-6 text-center">
<!-- Hero Illustration Placeholder -->
<div class="relative w-full max-w-sm mb-12 aspect-square flex items-center justify-center">
<div class="absolute inset-0 bg-primary/20 blur-[80px] rounded-full"></div>
<div class="relative w-64 h-64 glass-card rounded-xl flex items-center justify-center flex-col gap-4 shadow-2xl rotate-3 transform hover:rotate-0 transition-transform duration-500" data-alt="Abstract Nimiq style floating geometric shapes">
<span class="material-symbols-outlined text-primary text-6xl">receipt_long</span>
<div class="w-32 h-2 bg-white/10 rounded-full"></div>
<div class="w-24 h-2 bg-white/10 rounded-full"></div>
</div>
<!-- Small floating icon -->
<div class="absolute -top-4 -right-4 w-16 h-16 glass-card rounded-full flex items-center justify-center shadow-lg -rotate-12">
<span class="material-symbols-outlined text-accent-gold">payments</span>
</div>
</div>
<h2 class="text-white text-4xl md:text-5xl font-extrabold leading-tight tracking-tight mb-4 max-w-md">
                Split the bill, <br/>not the <span class="text-primary">friendship.</span>
</h2>
<p class="text-slate-400 text-lg mb-10 max-w-xs">
                The most seamless way to share expenses with anyone, anywhere.
            </p>
<!-- Action Buttons -->
<div class="w-full max-w-sm flex flex-col gap-4">
<button class="group relative flex items-center justify-center gap-3 w-full h-16 rounded-full bg-gradient-to-r from-primary to-[#05a5f5] text-white text-lg font-bold shadow-xl shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all">
<span class="material-symbols-outlined">photo_camera</span>
<span>Scan Receipt</span>
<div class="absolute inset-0 rounded-full bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<button class="flex items-center justify-center gap-3 w-full h-16 rounded-full border-2 border-slate-700 text-slate-300 text-lg font-semibold hover:bg-slate-800/50 hover:text-white transition-all">
<span class="material-symbols-outlined">edit_note</span>
<span>Enter Total Manually</span>
</button>
</div>
</main>
<!-- Footer Info -->
<footer class="p-8 flex flex-col items-center gap-6">
<div class="flex items-center gap-8 text-slate-400 text-sm font-medium">
<a class="hover:text-primary transition-colors flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-lg">history</span> Recent Splits
                </a>
<a class="hover:text-primary transition-colors flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-lg">help_outline</span> How it works
                </a>
</div>
<!-- Bottom Nav (Component-based) -->
<div class="w-full max-w-md glass-card rounded-full px-2 py-2 flex items-center justify-between">
<a class="flex flex-1 flex-col items-center justify-center gap-1 rounded-full py-2 bg-primary text-white" href="#">
<span class="material-symbols-outlined">home</span>
<p class="text-[10px] font-bold uppercase tracking-wider">Home</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-500 hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined">group</span>
<p class="text-[10px] font-bold uppercase tracking-wider">Groups</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-500 hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined">settings</span>
<p class="text-[10px] font-bold uppercase tracking-wider">Settings</p>
</a>
</div>
</footer>
</div>
</body></html>
