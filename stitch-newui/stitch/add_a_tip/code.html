<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SplitBill - Add a Tip</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#048acd",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1c23",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Header Section -->
<header class="flex items-center justify-between p-4 pt-6">
<button class="flex size-12 items-center justify-center rounded-full bg-slate-200 dark:bg-primary/20 text-slate-900 dark:text-primary transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-xl font-extrabold tracking-tight">Add a Tip</h1>
<div class="size-12"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-1 px-4 py-6 max-w-md mx-auto w-full">
<!-- Summary Cards -->
<div class="grid grid-cols-2 gap-4 mb-8">
<div class="flex flex-col gap-2 rounded-xl p-6 bg-white dark:bg-slate-800/50 border border-slate-200 dark:border-primary/10 shadow-sm">
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium">Total Bill</p>
<p class="text-slate-900 dark:text-white text-3xl font-extrabold tracking-tight">$84.00</p>
</div>
<div class="flex flex-col gap-2 rounded-xl p-6 bg-primary/10 dark:bg-primary/20 border border-primary/20 shadow-sm">
<p class="text-primary dark:text-primary text-sm font-medium">Tip Amount</p>
<p class="text-primary dark:text-primary text-3xl font-extrabold tracking-tight">$12.60</p>
</div>
</div>
<!-- Tip Selection Section -->
<section class="space-y-6">
<div class="flex items-center justify-between">
<h2 class="text-lg font-bold tracking-tight">Select Tip Percentage</h2>
<span class="text-sm font-medium text-slate-500 dark:text-slate-400">15% selected</span>
</div>
<!-- Tip Chips Grid -->
<div class="grid grid-cols-3 gap-3">
<button class="flex h-12 items-center justify-center rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-primary/20 dark:hover:bg-primary/30 text-slate-900 dark:text-slate-100 font-semibold transition-all border border-transparent hover:border-primary/50">
                    No Tip
                </button>
<button class="flex h-12 items-center justify-center rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-primary/20 dark:hover:bg-primary/30 text-slate-900 dark:text-slate-100 font-semibold transition-all border border-transparent hover:border-primary/50">
                    10%
                </button>
<button class="flex h-12 items-center justify-center rounded-xl bg-primary text-white font-semibold shadow-lg shadow-primary/30 ring-2 ring-primary ring-offset-2 dark:ring-offset-background-dark">
                    15%
                </button>
<button class="flex h-12 items-center justify-center rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-primary/20 dark:hover:bg-primary/30 text-slate-900 dark:text-slate-100 font-semibold transition-all border border-transparent hover:border-primary/50">
                    18%
                </button>
<button class="flex h-12 items-center justify-center rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-primary/20 dark:hover:bg-primary/30 text-slate-900 dark:text-slate-100 font-semibold transition-all border border-transparent hover:border-primary/50">
                    20%
                </button>
<button class="flex h-12 items-center justify-center rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-primary/20 dark:hover:bg-primary/30 text-slate-900 dark:text-slate-100 font-semibold transition-all border border-transparent hover:border-primary/50">
                    Custom
                </button>
</div>
<!-- Visualization Element -->
<div class="relative mt-8 p-6 rounded-xl overflow-hidden bg-gradient-to-br from-primary to-blue-600">
<div class="relative z-10">
<p class="text-white/80 text-sm font-medium mb-1">New Total per person</p>
<div class="flex items-baseline gap-2">
<span class="text-white text-4xl font-black">$48.30</span>
<span class="text-white/60 text-sm">/ 2 people</span>
</div>
</div>
<!-- Abstract Pattern Decoration -->
<div class="absolute -right-4 -bottom-4 opacity-20">
<span class="material-symbols-outlined text-9xl text-white">receipt_long</span>
</div>
</div>
</section>
<!-- Action Button -->
<div class="mt-10">
<button class="w-full py-4 bg-primary hover:bg-primary/90 text-white rounded-xl font-bold text-lg shadow-xl shadow-primary/20 transition-transform active:scale-[0.98]">
                Confirm &amp; Continue
            </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="sticky bottom-0 w-full border-t border-slate-200 dark:border-primary/10 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md px-4 pb-6 pt-3 flex justify-between items-center">
<a class="flex flex-1 flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined">home</span>
<p class="text-[10px] font-bold uppercase tracking-wider">Home</p>
</a>
<a class="flex flex-1 flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined">history</span>
<p class="text-[10px] font-bold uppercase tracking-wider">History</p>
</a>
<a class="flex flex-1 flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">universal_currency_alt</span>
<p class="text-[10px] font-bold uppercase tracking-wider">Split</p>
</a>
<a class="flex flex-1 flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined">settings</span>
<p class="text-[10px] font-bold uppercase tracking-wider">Settings</p>
</a>
</nav>
</body></html>
