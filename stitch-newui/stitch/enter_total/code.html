<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#048acd",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1c23",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-display">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between p-6">
<button class="flex items-center justify-center size-12 rounded-full bg-slate-200/50 dark:bg-primary/10 text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-lg font-bold tracking-tight">Split Bill</h2>
<div class="size-12"></div> <!-- Spacer for balance -->
</header>
<main class="flex-1 flex flex-col px-6 pt-8 max-w-md mx-auto w-full">
<!-- Main Question -->
<div class="text-center mb-10">
<h1 class="text-4xl font-extrabold tracking-tight mb-4">What’s the total bill?</h1>
<p class="text-slate-500 dark:text-primary/60 font-medium">Enter the final amount from your receipt</p>
</div>
<!-- Currency Selector -->
<div class="flex justify-center mb-8">
<div class="inline-flex bg-slate-200/50 dark:bg-primary/10 p-1.5 rounded-full">
<button class="px-6 py-2 rounded-full bg-primary text-white font-bold shadow-lg shadow-primary/20 transition-all">
                    $
                </button>
<button class="px-6 py-2 rounded-full text-slate-500 dark:text-primary/60 font-bold hover:bg-slate-300/50 dark:hover:bg-primary/20 transition-all">
                    €
                </button>
<button class="px-6 py-2 rounded-full text-slate-500 dark:text-primary/60 font-bold hover:bg-slate-300/50 dark:hover:bg-primary/20 transition-all">
                    £
                </button>
</div>
</div>
<!-- Large Numeric Input Container -->
<div class="flex-1 flex flex-col justify-start">
<div class="relative group">
<div class="absolute inset-y-0 left-6 flex items-center pointer-events-none">
<span class="text-4xl font-bold text-primary">$</span>
</div>
<input autofocus="" class="w-full bg-slate-100 dark:bg-primary/5 border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl py-10 pl-16 pr-6 text-5xl font-extrabold text-slate-900 dark:text-slate-100 placeholder:text-slate-300 dark:placeholder:text-primary/20 transition-all text-right" placeholder="0.00" step="0.01" type="number"/>
</div>
<!-- Visual Decoration / Context Image -->
<div class="mt-12 opacity-40 dark:opacity-20 flex justify-center">
<div class="w-full h-48 rounded-xl bg-gradient-to-b from-primary/30 to-transparent flex items-center justify-center overflow-hidden" data-alt="Abstract geometric shapes representing payment flow">
<span class="material-symbols-outlined text-[120px] text-primary/40">payments</span>
</div>
</div>
</div>
<!-- One-Handed Optimized Footer CTA -->
<div class="pb-10 pt-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white text-xl font-bold py-5 rounded-xl shadow-xl shadow-primary/30 flex items-center justify-center gap-2 group">
<span>Next</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<!-- Quick Suggestion Chips (Optional but helpful for one-hand) -->
<div class="flex gap-3 mt-6 overflow-x-auto no-scrollbar pb-2">
<button class="whitespace-nowrap px-6 py-3 bg-slate-200/50 dark:bg-primary/10 rounded-full text-sm font-bold border border-transparent hover:border-primary/50 transition-all">
                    $20.00
                </button>
<button class="whitespace-nowrap px-6 py-3 bg-slate-200/50 dark:bg-primary/10 rounded-full text-sm font-bold border border-transparent hover:border-primary/50 transition-all">
                    $50.00
                </button>
<button class="whitespace-nowrap px-6 py-3 bg-slate-200/50 dark:bg-primary/10 rounded-full text-sm font-bold border border-transparent hover:border-primary/50 transition-all">
                    $100.00
                </button>
<button class="whitespace-nowrap px-6 py-3 bg-slate-200/50 dark:bg-primary/10 rounded-full text-sm font-bold border border-transparent hover:border-primary/50 transition-all">
                    $150.00
                </button>
</div>
</div>
</main>
<!-- Bottom Safe Area Spacer -->
<div class="h-6"></div>
</body></html>
