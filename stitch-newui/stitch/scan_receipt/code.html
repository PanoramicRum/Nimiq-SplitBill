<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#048acd",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1c23",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
<title>SplitBill Receipt Capture</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-hidden">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-hidden">
<!-- Header -->
<div class="flex items-center justify-between p-4 z-20">
<button class="flex items-center justify-center size-12 rounded-full bg-slate-200/20 dark:bg-slate-800/40 backdrop-blur-md text-slate-900 dark:text-slate-100 hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight">Scan Receipt</h2>
<button class="flex items-center justify-center size-12 rounded-full bg-slate-200/20 dark:bg-slate-800/40 backdrop-blur-md text-slate-900 dark:text-slate-100 hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined">flashlight_on</span>
</button>
</div>
<!-- Camera Viewfinder Section -->
<div class="relative flex-1 px-4 py-2 flex flex-col items-center justify-center">
<!-- Viewfinder Container -->
<div class="relative w-full h-full max-w-md bg-slate-300 dark:bg-slate-900 rounded-xl overflow-hidden border-2 border-primary/30 shadow-2xl">
<!-- Background Image Placeholder (Viewfinder) -->
<div class="absolute inset-0 bg-cover bg-center opacity-80" data-alt="A desk with a restaurant receipt on it" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCd2rAuQjEFNEcjBtWRyCoNUrujTXWx8Mf0TMCFz1M_si_P2u3n9qu_T5QaeUVKf_RHcfIL_WD2bZaLX1jDAbYlrOklSYjmrcs_HnKXD7jsEiLZLQzPuKEMnBda382otKlbROX1epjoaMJkK5mJXizi35L0DkSv8ydtaxEKCwDtY94yVYq0z5WZ0GqPFY74nqHAkNnk56mxExl0VkxjR64tEZ5nhREoH2t7kyf2OIxE_TXPG_B-JtpR5X64tI5JS577AWiPvpDNNT8')"></div>
<!-- Overlay Gradient -->
<div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/40"></div>
<!-- Framing Guide -->
<div class="absolute inset-0 flex items-center justify-center p-8 pointer-events-none">
<div class="w-full h-full border-2 border-dashed border-white/50 rounded-lg relative">
<!-- Corner Accents -->
<div class="absolute -top-1 -left-1 size-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute -top-1 -right-1 size-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute -bottom-1 -left-1 size-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute -bottom-1 -right-1 size-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
<!-- Scanning Line Animation Effect (Static) -->
<div class="absolute top-1/2 left-0 w-full h-px bg-primary shadow-[0_0_15px_rgba(4,138,205,0.8)] opacity-60"></div>
</div>
</div>
<!-- Instruction Text -->
<div class="absolute bottom-10 left-0 right-0 text-center px-8">
<p class="text-white text-sm font-medium bg-black/40 backdrop-blur-sm py-2 px-4 rounded-full inline-block">
                        Align your receipt within the frame
                    </p>
</div>
</div>
</div>
<!-- Capture Controls -->
<div class="flex flex-col items-center gap-6 p-8 pb-12 z-20">
<div class="flex items-center justify-center gap-12">
<!-- Gallery Button -->
<button class="flex flex-col items-center gap-1 group">
<div class="size-12 rounded-full bg-slate-200/10 dark:bg-slate-800/40 backdrop-blur-md flex items-center justify-center text-slate-400 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">image</span>
</div>
</button>
<!-- Main Capture Button -->
<div class="relative group cursor-pointer">
<div class="absolute inset-0 bg-primary/20 rounded-full scale-125 group-hover:scale-150 transition-transform duration-300"></div>
<button class="relative size-20 rounded-full bg-white border-4 border-primary flex items-center justify-center active:scale-90 transition-all shadow-xl">
<div class="size-16 rounded-full bg-primary/10 border border-primary/20"></div>
</button>
</div>
<!-- Aspect Toggle/Info -->
<button class="flex flex-col items-center gap-1 group">
<div class="size-12 rounded-full bg-slate-200/10 dark:bg-slate-800/40 backdrop-blur-md flex items-center justify-center text-slate-400 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">auto_fix_high</span>
</div>
</button>
</div>
<!-- Gallery Link -->
<button class="flex items-center gap-2 px-6 py-3 rounded-full bg-primary/10 text-primary font-bold text-sm hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-lg">upload</span>
                Upload from Gallery
            </button>
</div>
<!-- Navigation Bar Spacer -->
<div class="h-6 bg-background-light dark:bg-background-dark"></div>
</div>
</body></html>
